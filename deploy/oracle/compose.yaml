name: orbita

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /data/orbita.sqlite
      SECURE_COOKIES: 'true'
      LIVEKIT_URL: ${LIVEKIT_URL:?Configure LIVEKIT_URL no arquivo privado de ambiente}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Configure LIVEKIT_API_KEY no arquivo privado de ambiente}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Configure LIVEKIT_API_SECRET no arquivo privado de ambiente}
    volumes:
      - app-data:/data
    expose:
      - '3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health').then(async r=>{if(!r.ok || !(await r.json()).ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      ORBITA_DOMAIN: ${ORBITA_DOMAIN:?Configure ORBITA_DOMAIN com o hostname publico do chat}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
